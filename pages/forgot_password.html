<!-- =========================================================
FILE: /pages/forgot_password.html
PURPOSE:
- "Forgot Password" page UI placeholder
- User enters email and clicks Send
- Real email sending logic will be added later
========================================================= -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forgot Password • FPM AI</title>

  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/forgot_password.css" />
</head>

<body>
  <div class="app-shell">
    <header class="app-header" id="appHeader"></header>

    <div class="app-content">
      <aside class="app-sidebar" id="appSidebar"></aside>

      <main class="app-main">
        <div class="main-card fp-card">
          <h1 data-i18n="fp_title">Forgot Password</h1>
          <p class="fp-sub" data-i18n="fp_desc">
            Enter your email. Later we will send a password reset link.
          </p>

          <div class="fp-form">
            <input id="fpEmail" class="fp-input" type="email" placeholder="Email" />
            <button id="fpSend" class="btn btn-primary" type="button" data-i18n="fp_send">
              Send
            </button>

            <button class="btn btn-ghost" type="button" onclick="location.href='/pages/login.html'" data-i18n="fp_back">
              Back to Login
            </button>

            <div id="fpMsg" class="fp-msg" role="status" aria-live="polite"></div>
          </div>
        </div>
      </main>
    </div>

    <footer class="app-footer" id="appFooter"></footer>
  </div>

  <script src="/js/layout.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/forgot_password.js"></script>
</body>
</html>
