<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Model Executive - FPM</title>

<style>
 /* ================= GLOBAL ================= */
html, body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont;
    background: linear-gradient(180deg, #1a1f2e, #161a26);
    color: #e6e9f5;
    overflow-x: hidden;
}

/* ================= HEADER ================= */
header {
    height: 64px;
    position: fixed;
    inset: 0 0 auto 0;
    background: linear-gradient(
        90deg,
        rgba(122,162,255,.18),
        rgba(30,36,56,.95) 40%,
        rgba(30,36,56,.95) 60%,
        rgba(122,162,255,.18)
    );
    backdrop-filter: blur(14px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    border-bottom: 1px solid rgba(122,162,255,.25);
    box-shadow: 0 6px 22px rgba(0,0,0,.45);
    z-index: 1000;
}

/* Logout – eski soft kırmızı */
#logoutBtn {
    padding: 8px 18px;
    border-radius: 18px;
    background: rgba(255,120,120,.18);
    color: #ff9b9b;
    border: 1px solid rgba(255,120,120,.35);
    cursor: pointer;
    transition: all .2s ease;
}
#logoutBtn:hover {
    background: rgba(255,120,120,.28);
    transform: translateY(-1px);
}

/* ================= SIDEBAR (DOKUNULMADI) ================= */
#sidebar {
    width: 200px;
    position: fixed;
    top: 64px;
    bottom: 0;
    left: 0;
    background: rgba(26,31,46,.97);
    border-right: 1px solid rgba(255,255,255,.06);
    padding-top: 16px;
}

#sidebar a {
    display: block;
    padding: 14px 18px;
    color: #cdd3f8;
    text-decoration: none;
    font-size: 15px;
    border-left: 4px solid transparent;
    transition: all .25s ease;
}

#sidebar a:hover {
    background: rgba(122,162,255,.12);
    color: #7aa2ff;
}

#sidebar a.active,
#sidebar a.model-active {
    background: rgba(122,162,255,.18);
    color: #7aa2ff;
    font-weight: 600;
    border-left-color: #7aa2ff;
}

/* ================= MAIN ================= */
#main {
    margin-left: 200px;
    margin-top: 64px;
    padding: 28px;
    padding-bottom: 120px;
}

/* ================= MODEL BUTTON GRID ================= */
.model-buttons {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 14px;
}

/* ================= ACTION BUTTON BASE ================= */
.action-btn {
    position: relative;
    padding: 14px 18px;
    border-radius: 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,.08);
    background: rgba(255,255,255,.04);
    color: #95a5e8;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;

    transition:
        transform .22s ease,
        box-shadow .22s ease,
        background .22s ease;
}

/* Hover – soft ve modern */
.action-btn:hover {
    transform: translateY(-2px);
    box-shadow:
        0 30px 38px rgba(0,0,0,.45),
        inset 0 0 0 1px rgba(122,162,255,.25);
}

/* ================= AKTİF İŞARET ================= */
.action-btn .active-dot {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 10px;
    opacity: 0;
    color: #7aa2ff;
    transition: opacity .15s ease;
}

/* En son tıklanan */
.action-btn.active .active-dot {
    opacity: 1;
}

/* ================= SOFT RENKLER ================= */

/* Game */
.action-btn[data-action="Game PULL"] {
    background: linear-gradient(135deg,#1e3a5f,#1e293b);
}

/* Standing */
.action-btn[data-action="Standing PULL"] {
    background: linear-gradient(135deg,#123c47,#1e293b);
}

/* Predict */
.action-btn[data-action="Predict"] {
    background: linear-gradient(135deg,#2b2f55,#1e293b);
}

/* Analysis */
.action-btn[data-action="Analysis"] {
    background: linear-gradient(135deg,#3b1d3f,#1e293b);
}

/* League */
.action-btn[data-action="League PULL"] {
    background: linear-gradient(135deg,#1f3d2b,#1e293b);
}

/* Update */
.action-btn.t-indigo {
    background: linear-gradient(135deg,#2a2f6a,#1e293b);
}

/* Model FIT */
.action-btn[data-action="MODEL_FIT"] {
    background: linear-gradient(135deg,#3f3a1f,#1e293b);
}

/* Clear Table */
.action-btn.t-clear-table {
    background: linear-gradient(135deg,#3f391f,#1e293b);
    color: #7aa2ff;
}

/* ================= CONFIG ================= */
.config-btn {
    background: linear-gradient(135deg,#243c5a,#1e293b);
    color: #7aa2ff;
    border-radius: 18px;
    padding: 14px 20px;
    font-weight: 700;
    cursor: pointer;
    border: 1px solid rgba(122,162,255,.25);
    transition: all .22s ease;
}
.config-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 50px 26px rgba(0,0,0,.45);
}

/* ================= LOG PANEL ================= */
.log-panel {
    background: #0f172a;
    color: #7f8fac;
    border-radius: 14px;
    padding: 16px;
    height: 320px;
    overflow-y: auto;
    font-family: ui-monospace, monospace;
    font-size: 13px;
    margin-top: 22px
}

/* ================= INPUT (KORUNDU) ================= */
.model-card.model-input {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    margin-top: 32px;   
}

#modelInput {
    width: 100%;
    max-width: 520px;
    padding: 14px 18px;
    border-radius: 14px;
    border: 1px solid rgba(148,163,184,.35);
    background: linear-gradient(180deg,#fff,#f8fafc);
}

/* Alt iki buton ortada */
.center-actions,
.stop-container {
    display: flex;
    justify-content: center;
}

/* Clear Logs */
.action-btn.t-amber {
    background: linear-gradient(135deg,#3f3a1f,#1e293b);
    color: #fde68a;
}

/* STOP */
.action-btn.t-red {
    background: linear-gradient(135deg,#3f1f1f,#1e293b);
    color: #ff9b9b;
}

/* ================= FOOTER ================= */
.app-footer {
    position: fixed;
    bottom: 0;
    left: 200px;
    right: 0;
    height: 44px;
    background: rgba(30,36,56,.9);
    border-top: 1px solid rgba(255,255,255,.06);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #aab0d6;
}
/* ===============================
   ACTION BUTTON – NEW EFFECT
   (mevcut layout ve renkler korunur)
================================ */

/* Hover: hafif ışık + öne gelme */
.action-btn:hover {
    transform: translateY(-2px);
    filter: brightness(1.08);
    box-shadow:
        0 50px 26px rgba(0,0,0,0.45),
        inset 0 0 0 1px rgba(255,255,255,0.18);
}

/* Tıklanan (seçili) buton */
.action-btn.active {
    filter: brightness(1.12);
    box-shadow:
        0 0 0 2px rgba(122,162,255,0.45),
        0 50px 40px rgba(0,0,0,0.6);
}

/* Seçili olduğunu gösteren işaret */
.action-btn.active::after {
    content: "✔";
    position: absolute;
    top: 10px;
    right: 14px;
    font-size: 13px;
    font-weight: 700;
    color: rgba(255,255,255,0.9);
    text-shadow: 0 0 6px rgba(0,0,0,0.6);
}

/* Tıklama anı (press feedback) */
.action-btn:active {
    transform: scale(0.97);
}

/* ================= INPUT – DARK UYUMLU ================= */

/* Log panelden biraz ayır */
.model-card.model-input {
    margin-top: 22px;
}

/* Input alanı */
#modelInput {
    background: rgba(30,36,56,0.95);
    color: #e6e9f5;
    border: 1px solid rgba(122,162,255,0.35);
    box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.04),
        0 6px 18px rgba(0,0,0,0.35);
}

/* Placeholder rengi */
#modelInput::placeholder {
    color: rgba(205,211,248,0.55);
}

/* Focus efekti – modern ama soft */
#modelInput:focus {
    outline: none;
    border-color: #7aa2ff;
    box-shadow:
        0 0 0 2px rgba(122,162,255,0.25),
        0 10px 26px rgba(122,162,255,0.25);
    background: rgba(30,36,56,1);
}
html, body {
    min-height: 100%;
    background: linear-gradient(180deg, #1a1f2e, #161a26);
    overscroll-behavior: none;
}

.log-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 12px;
    font-size: 12px;
}

.log-table th {
    background: #1e293b;
    color: #e5e7eb;
    padding: 6px;
    position: sticky;
    top: 0;
}

.log-table td {
    border: 1px solid #334155;
    padding: 6px;
    color: #e5e7eb;
}

.log-table tr:nth-child(even) {
    background: #020617;
}


/* ================================
   DARK MODE • SPACE BLUE THEME
   ACCESS DENIED
================================ */

.access-denied{
  /* Space Blue Palette */
  --bg-main:   #0b1220;
  --bg-soft:   #0f1b2e;
  --bg-glass:  rgba(20, 40, 70, 0.45);

  --blue-200:  #7dd3fc;
  --blue-300:  #38bdf8;
  --blue-400:  #0ea5e9;
  --blue-500:  #0284c7;

  --danger:    #f87171;
  --border:    rgba(125, 211, 252, 0.25);

  --text-main: #e5e7eb;
  --text-soft: #9ca3af;

  display: flex;
  align-items: flex-start;
  gap: 14px;

  padding: 18px 20px;
  border-radius: 16px;

  background:
    radial-gradient(
      120% 120% at top left,
      rgba(56, 189, 248, 0.12),
      transparent 60%
    ),
    linear-gradient(180deg, var(--bg-soft), var(--bg-main));

  border: 1px solid var(--border);

  color: var(--text-main);

  box-shadow:
    0 20px 50px rgba(0, 0, 0, 0.65),
    inset 0 1px 0 rgba(255, 255, 255, 0.04);

  max-width: 560px;
}

/* Başlık */
.access-denied h2{
  margin: 0;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.02em;
}

.access-denied .deny{
  color: var(--danger);
}

/* Açıklama */
.access-denied p{
  margin: 6px 0 0;
  font-size: 14px;
  line-height: 1.6;
  color: var(--text-soft);
}

/* Ünlem ikonu */
.ad-icon{
  width: 38px;
  height: 38px;
  border-radius: 12px;

  display: grid;
  place-items: center;

  background:
    linear-gradient(
      145deg,
      rgba(56, 189, 248, 0.25),
      rgba(2, 132, 199, 0.15)
    );

  border: 1px solid rgba(56, 189, 248, 0.35);

  color: var(--blue-200);
  font-weight: 900;
  font-size: 17px;

  box-shadow:
    0 8px 20px rgba(14, 165, 233, 0.25),
    inset 0 1px 0 rgba(255, 255, 255, 0.08);
}

/* Aksiyon alanı */
.ad-actions{
  display: flex;
  gap: 12px;
  margin-top: 14px;
  flex-wrap: wrap;
}

/* Ortak buton stili */
.btn{
  text-decoration: none;
  border-radius: 14px;
  padding: 11px 18px;

  font-size: 14px;
  font-weight: 600;
  letter-spacing: -0.01em;

  border: 1px solid transparent;
  cursor: pointer;

  transition:
    transform 120ms ease,
    box-shadow 120ms ease,
    background 120ms ease,
    border-color 120ms ease;
}

.btn:active{
  transform: translateY(1px);
}

/* Primary – Space Blue */
.btn-primary{
  color: #e0f2fe;

  background:
    linear-gradient(
      145deg,
      var(--blue-400),
      var(--blue-500)
    );

  box-shadow:
    0 12px 30px rgba(14, 165, 233, 0.45),
    inset 0 1px 0 rgba(255, 255, 255, 0.15);
}

.btn-primary:hover{
  box-shadow:
    0 16px 40px rgba(14, 165, 233, 0.65);
}

/* Ghost – Dark Glass */
.btn-ghost{
  color: var(--blue-200);

  background: var(--bg-glass);
  border: 1px solid rgba(125, 211, 252, 0.25);

  backdrop-filter: blur(6px);
}

.btn-ghost:hover{
  border-color: rgba(125, 211, 252, 0.45);
  background: rgba(20, 40, 70, 0.65);
}

.buttons-separator {
    width: 100%;
    height: 1px;
    margin: 18px 0;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.35),
        transparent
    );
}

</style>

</head>

<body>

<header>
    <a href="/index.html" style="text-decoration:none;color:inherit;">
        <div style="display:flex;align-items:center;gap:10px;">
            <img src="/docs/fpm_logo.jpg" style="height:34px;border-radius:4px;">
            <strong>FPM AI Model</strong>
        </div>
    </a>
    <div style="display:flex;align-items:center;gap:20px;">
        <div id="headerUserInfo" style="display:none;"></div>
        <button id="loginBtn">Login</button>
        <button id="logoutBtn" style="display:none;">Logout</button>
    </div>
</header>

<div id="sidebar"></div>
<div id="main"></div>
<footer class="app-footer">© 2025 FPM Web App</footer>

<script>
document.addEventListener("DOMContentLoaded", () => {
let waitingForAction = null;
let waitingForStandingInput = false;
let standingStep = 0;
let standing_is_append = "";



const sidebar = document.getElementById("sidebar");
const main = document.getElementById("main");
const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const headerUserInfo = document.getElementById("headerUserInfo");
const currentUser = JSON.parse(sessionStorage.getItem("currentUser") || "null");

/* HEADER */
if (!currentUser) {
    loginBtn.style.display="inline-block";
    logoutBtn.style.display="none";
    headerUserInfo.style.display="none";
} else {
    loginBtn.style.display="none";
    logoutBtn.style.display="inline-block";
    headerUserInfo.style.display="block";
    headerUserInfo.innerHTML=`User: <strong>${currentUser.username}</strong> (Type: ${currentUser.user_type})`;
}
loginBtn.onclick=()=>location.href="/pages/login.html";
logoutBtn.onclick=()=>{sessionStorage.clear();location.href="/";};

/* ACCESS */
if (!currentUser || currentUser.user_type!=="admin") {
    sidebar.innerHTML=`<a href="/index.html">Home</a>`;
    main.innerHTML=`<div class="access-denied" role="alert" aria-live="polite">
  <div class="ad-icon" aria-hidden="true">!</div>

  <div class="ad-content">
    <h2>Access <span class="deny">Denied</span></h2>
    <p>You do not have permission to access this page..</p>

    <div class="ad-actions">
      <a href="/pages/login.html" class="btn btn-primary">
        Log In
      </a>

      <a href="/index.html" class="btn btn-ghost">
        Home
      </a>
    </div>
  </div>
</div>
`;
    return;
}

/* SIDEBAR */
sidebar.innerHTML=`
<a href="/index.html">Home</a>
<a href="/pages/admin.html">Admin Panel</a>
<a href="/pages/model/model.html" class="model-active">Model Panel</a>

`
;

/* UI */
/* UI */
main.innerHTML = `
<h2>Model Executive</h2>

<div class="model-panel">
<div class="model-card">

<!-- 🔼 ÜST BUTON GRUBU -->
<div class="model-buttons top-actions">

<button class="action-btn" data-action="Game PULL">⚽️ Game PULL</button>
<button class="action-btn" data-action="Standing PULL">📊 Standing PULL</button>
<button class="action-btn" data-action="Predict">🎯 Predict</button>
<button class="action-btn" data-action="Analysis">📈 Analysis</button>
<button class="action-btn" data-action="League PULL">🏆 League PULL</button>

<button class="action-btn t-indigo" data-action="UPDATE_PULL">
    <span class="active-dot">●</span> 🔄 Update PULL
</button>

</div>

<!-- ───────── FULL WIDTH SEPARATOR ───────── -->
<div class="buttons-separator"></div>

<!-- 🔽 ALT BUTON GRUBU -->
<div class="model-buttons bottom-actions">

<button class="action-btn t-indigo" data-action="SHOW_CURRENT">
    <span class="active-dot">●</span> Show Current
</button>

<button class="action-btn" data-action="MODEL_FIT">🧠 Model FIT</button>

<button class="action-btn t-clear-table" data-action="CLEAR_TABLE">
    <span class="active-dot">●</span> 🗑️ Clear Table
</button>

<button class="action-btn t-purple" data-action="Backup">
    <span class="active-dot">●</span> 🧩 Backup Cloud
</button>

<button id="btnConfiguration" class="config-btn">⚙️ Configration</button>

<button class="action-btn t-red" data-action="STOP">
    <span class="active-dot">●</span> 🚨 STOP RUN
</button>

</div>
</div>

<div class="model-card">
<div class="log-panel" id="logPanel">
    <div class="log-line system">
        [SYSTEM] Ready for any action. Please press any action button! ☝️☝️☝️
    </div>
</div>
</div>

<div class="model-card model-input">
    <input id="modelInput" type="text" placeholder="provide your input from here ➡️ [ENTER]" />

    <div class="model-input-actions">
        <button class="action-btn t-amber" id="btnClear">
            <span class="active-dot">●</span> Clear Logs
        </button>
    </div>
</div>

</div>
`;


// ⚙️ CONFIGURATION BUTTON
const configBtn = document.getElementById("btnConfiguration");
if (configBtn) {
    configBtn.addEventListener("click", () => {
        window.location.href = "/pages/model/config.html";

    });
}



/* LOGIC */
const logPanel=document.getElementById("logPanel");
const inputEl=document.getElementById("modelInput");
// başlangıçta input kilitli
inputEl.disabled = true;

const buttons=[...document.querySelectorAll(".action-btn")];
const clearBtn=document.getElementById("btnClear");

function addLog(t,c="action"){
    const d=document.createElement("div");
    d.className=`log-line ${c}`; d.textContent=t;
    logPanel.appendChild(d); logPanel.scrollTop=logPanel.scrollHeight;
    
    if (t === "table") {
    renderTable(message);
    return;
}

}

// 🔁 BACKEND'DEN PYTHON LOG'LARINI ÇEK
setInterval(async () => {
    try {
        const res = await fetch("/api/model-logs");
        const logs = await res.json();

        logs.forEach(log => {
    if (!log.message) return;

    // 🔥 TABLO GELDİYSE
    if (log.type === "table") {
        renderTable(log.message);
        return;
    }

    // 🔹 NORMAL LOG
    addLog(
        log.message.trim(),
        log.type === "error" ? "system" : "action"
    );
});

    } catch (err) {
        // sessiz geçiyoruz
    }
}, 2000);

function setActive(b){buttons.forEach(x=>x.classList.remove("active"));if(b)b.classList.add("active");}

buttons.forEach(btn => {
    if (btn === clearBtn) return;

    btn.onclick = () => {
        const action = btn.dataset.action;
        setActive(btn);
        addLog(`[ACTION] ${action}`);

        /* =====================
           🛑 STOP BUTONU
        ===================== */
        if (action === "STOP") {
            fetch("/api/game-pull/stop", { method: "POST" });
            // addLog("[SYSTEM] ❌python killed", "system");
            return;
        }

        /* =====================
           🎮 GAME PULL
        ===================== */
        if (action === "Game PULL") {

            const today = new Date();

            const dd = String(today.getDate()).padStart(2, "0");
            const mm = String(today.getMonth() + 1).padStart(2, "0");
            const yyyy = today.getFullYear();

            const todayFormatted = `${dd}-${mm}-${yyyy}`;

            addLog(
                `[QUESTION-INPUT] Please enter:
        Start Date (DD-MM-YYYY)
        Day Count
        Example: ${todayFormatted} 2`,
                "system"
            );

            waitingForAction = "game-pull";

            inputEl.disabled = false;

            // 👇 input içine hazır yazı
            inputEl.value = `${todayFormatted}`;

            // opsiyonel: ipucu metni yine kalsın
            inputEl.placeholder = "DD-MM-YYYY DayCount";

            inputEl.focus();

            // cursor en sona gelsin
            inputEl.setSelectionRange(inputEl.value.length, inputEl.value.length);

            return;
        }



        /* =====================
           📊 STANDING PULL
        ===================== */
        if (action === "Standing PULL") {

            // 1️⃣ İlk tıklama → input iste
            if (!waitingForStandingInput) {
                waitingForStandingInput = true;

                inputEl.disabled = false;
                inputEl.placeholder = "1) add to container? | 2) clear the table?";
                inputEl.focus();

                addLog("[QUESTION?] Current standing will be added to RAW Container? yes-no?", "system");
                addLog("[QUESTION?] STANDING table will be cleared? yes-no? ", "system");

                return;
            }
        

            /* =====================
   📊 STANDING STEP 1
        ===================== */
        if (standingStep === 1) {
            standing_is_append = v;
            standingStep = 2;

            inputEl.value = "";
            inputEl.placeholder = "Respond? Yes / No";
            inputEl.focus();

            addLog("[SYSTEM] Standing Pull → Step 2: respond", "system");
            return;
        }

        /* =====================
        📊 STANDING STEP 2
        ===================== */
        if (standingStep === 2) {
            fetch("/api/standing-pull", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    is_append: standing_is_append,
                    respond: v
                })
            });

            addLog("[SYSTEM] Standing PULL started", "system");

            standingStep = 0;
            standing_is_append = "";
            inputEl.value = "";
            inputEl.disabled = true;
            inputEl.placeholder = "wait...";
            return;
        }

                    // 2️⃣ Input kontrol
                    const val = inputEl.value.trim();
                    if (!val) {
                        addLog("[ERROR] Input empty", "system");
                        return;
                    }

                    // 3️⃣ Input tamam → Python çağır
                    inputEl.disabled = true;
                    waitingForStandingInput = false;

                    fetch("/api/standing-pull", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ input: val })
                    });

                    addLog("[ACTION] Standing Pull started", "action");
                    return;
                }
        // 🔮 PREDICT button action
        if (action === "Predict") {
            addLog("[ACTION] Predict started", "action");

            fetch("/api/predict", {
                method: "POST"
            });
            addLog(
        "[QUESTION] Do you want to calculate only new games?\nWrite only yes or no",
        "system"

function renderTable(jsonText) {
    let data;
    try {
        data = JSON.parse(jsonText);
    } catch {
        addLog("[ERROR] Failed to render table", "system");
        return;
    }

    if (!data.length) {
        addLog("[SYSTEM] Table is empty", "system");
        return;
    }

    const table = document.createElement("table");
    table.className = "log-table";

    const thead = document.createElement("thead");
    const headerRow = document.createElement("tr");

    Object.keys(data[0]).forEach(key => {
        const th = document.createElement("th");
        th.textContent = key;
        headerRow.appendChild(th);
    });

    thead.appendChild(headerRow);
    table.appendChild(thead);

    const tbody = document.createElement("tbody");

    data.forEach(row => {
        const tr = document.createElement("tr");
        Object.values(row).forEach(val => {
            const td = document.createElement("td");
            td.textContent = val;
            tr.appendChild(td);
        });
        tbody.appendChild(tr);
    });

    table.appendChild(tbody);
    logPanel.appendChild(table);
    logPanel.scrollTop = logPanel.scrollHeight;
}
