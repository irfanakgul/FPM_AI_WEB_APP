<!-- =========================================================
     FILE: public/pages/model/model.html
     PURPOSE: Model Panel page (NO SIDEBAR) - uses centralized header/footer
     ========================================================= -->
<!doctype html>
<html lang="en">
<head>
  <!-- [MODEL PANEL] Basic meta -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Model Panel - FPM</title>

  <!-- [GLOBAL CSS] Header / Footer / common layout styles -->
  <link rel="stylesheet" href="/css/style.css" />

  <!-- [PAGE CSS] Only Model page styles -->
  <link rel="stylesheet" href="/css/model.css" />
</head>

<!-- [NO SIDEBAR PAGE] body class lets us adjust layout in CSS -->
<body class="no-sidebar">

  <!-- [CENTRAL HEADER PLACEHOLDER] layout.js will inject header.html -->
  <div id="appHeader"></div>

  <!-- =========================================================
       [PAGE MAIN]
       IMPORTANT: id="main" is kept (old model.html logic expects it)
       ========================================================= -->
  <main id="main" class="page-main"></main>

  <!-- [CENTRAL FOOTER PLACEHOLDER] layout.js will inject footer.html -->
  <div id="appFooter"></div>

  <!-- [LAYOUT LOADER] inject header/footer -->
  <script src="/js/layout.js"></script>

  <!-- [GLOBAL APP LOGIC] login/logout UI + language switching etc. -->
  <script src="/js/app.js"></script>

  <!-- [MODEL PAGE LOGIC] old model panel logic (adapted, sidebar removed) -->
  <script src="/js/model.js"></script>
</body>
</html>
