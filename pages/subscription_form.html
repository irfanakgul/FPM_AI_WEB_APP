<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create Subscription</title>

<style>
    /* ================= GLOBAL (NO WHITE SCROLL) ================= */
html, body {
    margin: 0;
    height: 100%;
    font-family: system-ui, -apple-system, BlinkMacSystemFont;
    background: linear-gradient(180deg, #1a1f2e, #161a26);
    color: #e6e9f5;
    overflow-x: hidden;
}

/* ================= HEADER ================= */
header {
    height: 60px;
    background:
        linear-gradient(
            90deg,
            rgba(122,162,255,0.18),
            rgba(30,36,56,0.95) 40%,
            rgba(30,36,56,0.95) 60%,
            rgba(122,162,255,0.18)
        );
    color: white;

    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;

    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;

    border-bottom: 1px solid rgba(122,162,255,0.25);
}

header img {
    height: 34px;
    border-radius: 6px;
}

#headerUserInfo {
    font-size: 14px;
    opacity: 0.85;
    margin-right: 16px;
    display: none;
}

header button {
    padding: 8px 18px;
    border-radius: 18px;
    font-size: 14px;
    cursor: pointer;

    background: rgba(122,162,255,0.18);
    color: #7aa2ff;
    border: 1px solid rgba(122,162,255,0.35);

    transition: 0.2s;
}

header button:hover {
    background: rgba(122,162,255,0.28);
    transform: translateY(-1px);
}

#logoutBtn {
    display: none;
    background: rgba(255,120,120,0.18);
    color: #ff9b9b;
    border: 1px solid rgba(255,120,120,0.35);
}

/* ================= SIDEBAR ================= */
#sidebar {
    position: fixed;
    top: 60px;
    bottom: 0;
    left: 0;
    width: 200px;

    background: rgba(26,31,46,0.96);
    border-right: 1px solid rgba(255,255,255,0.06);
    padding-top: 20px;
}

#sidebar a {
    display: block;
    padding: 12px 16px;
    text-decoration: none;
    color: #cdd3f8;
    border-left: 4px solid transparent;
    transition: 0.25s;
}

#sidebar a.active {
    background: rgba(122,162,255,0.18);
    color: #7aa2ff;
    font-weight: 600;
    border-left-color: #7aa2ff;
}

#sidebar a:hover {
    background: rgba(122,162,255,0.12);
    color: #7aa2ff;
}

/* ================= MAIN ================= */
#main {
    margin-left: 200px;
    margin-top: 60px;
    padding: 32px;
    padding-bottom: 120px;
    min-height: 100vh;
}

/* ================= CARD ================= */
.card {
    max-width: 600px;
    margin: auto;

    background: rgba(30,36,56,0.9);
    backdrop-filter: blur(12px);
    padding: 32px;
    border-radius: 18px;

    box-shadow:
        0 14px 34px rgba(0,0,0,0.45),
        inset 0 0 0 1px rgba(255,255,255,0.05);
}

h2 {
    margin-top: 0;
    margin-bottom: 24px;
    text-align: center;
    color: #ffffff;
    letter-spacing: 0.4px;
}

/* ================= FORM ================= */
.form-group {
    margin-bottom: 18px;
}

label {
    font-weight: 600;
    margin-bottom: 6px;
    display: block;
    color: #d6dbff;
}

input, select {
    width: 100%;
    padding: 12px;
    font-size: 15px;

    background: rgba(255,255,255,0.06);
    color: #ffffff;

    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;

    transition: 0.2s;
}

input::placeholder {
    color: #aab0d6;
}

input:focus, select:focus {
    outline: none;
    background: rgba(255,255,255,0.1);
    border-color: #7aa2ff;
}

/* ================= SUBMIT BUTTON ================= */
#btnSubmit {
    margin-top: 10px;
    width: 100%;
    padding: 14px;

    background: linear-gradient(90deg, #5f8cff, #7aa2ff);
    color: white;

    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;

    transition: 0.25s;
}

#btnSubmit:hover {
    transform: translateY(-1px);
    box-shadow: 0 0 18px rgba(122,162,255,0.45);
}

/* ================= SUCCESS ================= */
#successMsg {
    display: none;
    margin-top: 16px;
    color: #4ade80;
    text-align: center;
    font-weight: bold;
}

/* ================= FOOTER ================= */
footer {
    position: fixed;
    bottom: 0;
    left: 200px;
    right: 0;

    padding: 12px;
    text-align: center;

    background: rgba(30,36,56,0.9);
    border-top: 1px solid rgba(255,255,255,0.06);
    color: #aab0d6;
    font-size: 14px;
}

html, body {
    min-height: 100%;
    background: linear-gradient(180deg, #1a1f2e, #161a26);
    overscroll-behavior: none;
}

</style>
</head>
<body>

<!-- HEADER -->
<header>
    <div onclick="window.location.href='/index.html'" style="cursor:pointer;display:flex;align-items:center;gap:10px;">
        <img src="/docs/fpm_logo.jpg">
        <strong>FPM Subscription</strong>
    </div>

    <div style="display:flex;align-items:center;gap:12px;">
        <div id="headerUserInfo"></div>

        <button id="loginBtn">Login</button>
        <button id="logoutBtn">Logout</button>
    </div>
</header>

<!-- SIDEBAR -->
<div id="sidebar">
    <a href="/index.html">Home</a>
    <a href="/pages/contact.html">Contact</a>
</div>

<!-- MAIN -->
<div id="main">
    <div class="card">
        <h2>Subscription Form</h2>

        <form id="subsForm">

            <div class="form-group">
                <label>Username</label>
                <input id="username" readonly>
            </div>

            <div class="form-group">
                <label>E-mail</label>
                <input id="mail" readonly>
            </div>

            <div class="form-group">
                <label>Full Name</label>
                <input id="name" placeholder="Your full name (optional)">
            </div>

            <div class="form-group">
                <label>Subscription Type</label>
                <select id="subsType" required>
                    <option value="trial">Trial (7 Days)</option>
                    <option value="monthly">Monthly</option>
                    <option value="yearly">Yearly</option>
                </select>
            </div>

            <button id="btnSubmit">Start Subscription</button>

            <div id="successMsg">✔ Subscription created!</div>

        </form>
    </div>
</div>

<footer>© 2025 FPM Web App</footer>


<script>
/* ========================================================
   LOGIN CHECK + AUTO FILL USER DATA
======================================================== */
document.addEventListener("DOMContentLoaded", async () => {

    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const headerUserInfo = document.getElementById("headerUserInfo");

    let currentUser = JSON.parse(sessionStorage.getItem("currentUser") || "null");

    if (!currentUser) {
        alert("You must log in before subscribing.");
        window.location.href = "/pages/login.html";
        return;
    }

    // show header user info
    loginBtn.style.display = "none";
    logoutBtn.style.display = "inline-block";
    headerUserInfo.style.display = "block";
    headerUserInfo.innerHTML = `User: <strong>${currentUser.username}</strong>`;

    // fill username
    document.getElementById("username").value = currentUser.username;

    // fetch the user's MAIL from info sheet (server endpoint)
    const res = await fetch("/api/user/get-info", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ username: currentUser.username })
    });

    const json = await res.json();

    if (json.success) {
        document.getElementById("mail").value = json.mail || "";
        document.getElementById("name").value = json.name || "";
    }

    logoutBtn.onclick = () => {
        sessionStorage.removeItem("currentUser");
        window.location.href = "/index.html";
    };
});
</script>


<script>
/* ========================================================
   SUBSCRIPTION FORM SUBMIT
======================================================== */
/* ========================================================
   SUBSCRIPTION FORM SUBMIT (payment version)
======================================================== */
document.getElementById("subsForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const username = document.getElementById("username").value;
  const fullName = document.getElementById("name").value.trim();
  const firstName = fullName.split(" ")[0];
  const lastName = fullName.split(" ")[1] || "";
  const email = document.getElementById("mail").value;
  const plan = document.getElementById("subsType").value;

  const res = await fetch("/payment", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      username,
      firstName,
      lastName,
      email,
      plan
    })
  });

  const stripeUrl = await res.text();
  window.location.assign(stripeUrl);
});


    </script>


</script>

</body>
</html>
