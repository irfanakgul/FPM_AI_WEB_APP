<!-- =========================================================
FILE: /pages/weekly.html
PURPOSE:
- Weekly Games page converted to central layout (header/sidebar/footer injected)
- Keeps original weekly logic + endpoints + permissions
- Language support comes from global app.js (localStorage.lang + lang:changed)
NOTES:
- No inline header/sidebar/footer here anymore
- Weekly content is hidden until subscription/permission check passes
========================================================= -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weekly Games</title>

  <!-- =========================================================
  EXTERNAL: XLSX (Excel Export)
  ========================================================= -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <!-- =========================================================
  GLOBAL CSS + PAGE CSS
  ========================================================= -->
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/weekly.css" />
</head>

<body>
  <div class="app-shell">
    <!-- =========================================================
    CENTRAL HEADER (injected)
    ========================================================= -->
    <header class="app-header" id="appHeader"></header>

    <div class="app-content">
      <!-- =========================================================
      CENTRAL SIDEBAR (injected)
      ========================================================= -->
      <aside class="app-sidebar" id="appSidebar"></aside>

      <!-- =========================================================
      MAIN
      ========================================================= -->
      <main class="app-main">
        <div class="main-card weekly-card">

          <!-- Page head -->
          <div class="weekly-head">
            <div>
              <h2 id="pageTitle" data-i18n="weekly_title">Weekly Games</h2>
              <div class="weekly-sub" data-i18n="weekly_desc">
                Filter weekly games by date and export to Excel.
              </div>
            </div>
          </div>

          <!-- Status line (no popups) -->
          <div id="status" class="weekly-status"></div>

          <!-- =====================================================
          WEEKLY CONTENT (hidden until permission granted)
          ====================================================== -->
          <div id="weeklyContent" style="display:none;">
            <div class="weekly-controls">
              <label id="labelSelectDate" class="weekly-label">
                <span data-i18n="select_date">Select Date:</span>
                <select id="dateSelect" multiple size="6"></select>
              </label>

              <div class="weekly-actions">
                <button id="selectAllBtn" class="btn-soft" data-i18n="all">All</button>
                <button id="filterBtn" class="btn-primary" data-i18n="filter">Filter</button>
                <button id="clearBtn" class="btn-soft" data-i18n="clear">Clear</button>
                <button id="exportExcelBtn" class="btn-primary" data-i18n="export_excel">Export Excel</button>
              </div>
            </div>

            <div id="tableWrap" class="weekly-table-wrap"></div>
          </div>

          <!-- =====================================================
          BLOCKER AREA (replaces old body.innerHTML rewrite)
          ====================================================== -->
          <div id="weeklyBlocker" style="display:none;"></div>

        </div>
      </main>
    </div>

    <!-- =========================================================
    CENTRAL FOOTER (injected)
    ========================================================= -->
    <footer class="app-footer" id="appFooter"></footer>
  </div>

  <!-- =========================================================
  SCRIPTS (order matters)
  ========================================================= -->
  <script src="/js/layout.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/weekly.js"></script>
</body>
</html>
