function el(id){ return document.getElementById(id); }

function applyLangSafe() {

    const ftr = el("flag-tr");

    if (window.__blockerCtx && window.__blockerCtx.active) {

<script>
/* =====================================================
   USER SESSION (same logic)
===================================================== */
const currentUser = JSON.parse(sessionStorage.getItem("currentUser") || "null");

document.getElementById("headerUserInfo").innerHTML =
    `User: <strong>${currentUser?.username || ""}</strong>
     (Type: ${currentUser?.user_type || ""})
     | <span id="activeTimer">Active: 0m 0s</span>`;

document.getElementById("logoutBtn").onclick = () => {
    sessionStorage.removeItem("currentUser");
    sessionStorage.removeItem("activeSeconds");
    window.location.href = "/index.html";
};

/* TIMER */
function startTimer() {
    let sec = Number(sessionStorage.getItem("activeSeconds") || 0);
    setInterval(() => {
        sec++;
        sessionStorage.setItem("activeSeconds", sec);
        const m = Math.floor(sec/60);
        const s = sec % 60;
        document.getElementById("activeTimer").textContent = `Active: ${m}m ${s}s`;
    }, 1000);
}
startTimer();

/* =====================================================
   WEEKLY LOGIC (same endpoints/flow)
===================================================== */
const sheetId = "1c_0Maup2VkR1yg-RjkCbVS1e7d_ng0wgMGY43nFPn3U";
let fullData = [];

const dateSelect = document.getElementById("dateSelect");
const tableWrap = document.getElementById("tableWrap");
const statusDiv = document.getElementById("status");

/* LOAD CUSTOMER DATA */
(async function loadSheet() {
    statusDiv.textContent = T[lang].loading;

    const res = await fetch("/api/load-sheet", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ sheetId, sheetName: "CUSTOMER" })
    });

    const json = await res.json();

    if (!json.success) {
        statusDiv.className = "error";
        statusDiv.textContent = T[lang].cannot_load_customer;
        return;
    }

    fullData = json.data;

    loadDates();
    renderTable(fullData);

    statusDiv.className = "success";
    statusDiv.textContent = T[lang].loaded_rows(fullData.length);
})();

/* DATE LIST */
function loadDates() {
    const dates = [...new Set(fullData.map(r => r["MacTarihi"]))];
    dateSelect.innerHTML = "";
    dates.forEach(d => {
        dateSelect.innerHTML += `<option value="${d}">${d}</option>`;
    });
}

/* SELECT ALL */
document.getElementById("selectAllBtn").onclick = () => {
    [...dateSelect.options].forEach(o => o.selected = true);
};

/* FILTER */
document.getElementById("filterBtn").onclick = () => {
    const selected = [...dateSelect.selectedOptions].map(o => o.value);
    const filtered = fullData.filter(r => selected.includes(r["MacTarihi"]));
    renderTable(filtered);

    statusDiv.className = "success";
    statusDiv.textContent = T[lang].rows_found(filtered.length);
};

/* CLEAR */
document.getElementById("clearBtn").onclick = () => {
    renderTable(fullData);
    statusDiv.textContent = "";
};

/* TABLE RENDER */
function renderTable(rows) {
    if (!rows.length) { tableWrap.innerHTML = ""; return; }

    const headers = Object.keys(rows[0]);
    let html = `<table><thead><tr>`;
    headers.forEach(h => html += `<th>${h}</th>`);
    html += `</tr></thead><tbody>`;

    rows.forEach(r => {
        html += `<tr>`;
        headers.forEach(h => {
            html += `<td>${r[h] || ""}</td>`;
        });
        html += `</tr>`;
    });

    html += `</tbody></table>`;
    tableWrap.innerHTML = html;
}

/* TIMESTAMP */
function getTimestamp() {
    const now = new Date();
    const dd = String(now.getDate()).padStart(2, '0');
    const mm = String(now.getMonth()+1).padStart(2, '0');
    const yy = now.getFullYear();
    const HH = String(now.getHours()).padStart(2, '0');
    const MM = String(now.getMinutes()).padStart(2, '0');
    return `${dd}${mm}${yy}${HH}${MM}`;
}

/* EXCEL EXPORT */
document.getElementById("exportExcelBtn").onclick = () => {
    const table = document.querySelector("#tableWrap table");

    if (!table) {
        statusDiv.className="error";
        statusDiv.textContent = T[lang].nothing_export;
        return;
    }

    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.table_to_sheet(table);
    XLSX.utils.book_append_sheet(wb, ws, "CUSTOMER");

    const filename = `CUSTOMER_${getTimestamp()}.xlsx`;
    XLSX.writeFile(wb, filename);

    statusDiv.className="success";
    statusDiv.textContent = T[lang].exported(filename);
};
</script>

    let currentUser = JSON.parse(sessionStorage.getItem("currentUser") || "null");

    if (!currentUser) {
        blockWeeklyAccess("msg_login_required", "/pages/login.html", "btn_login");
        return;
    }

    // Weekly page allowed roles
    const allowedRoles = ["client", "admin"];
    if (!allowedRoles.includes(currentUser.user_type)) {
        blockWeeklyAccess("msg_no_role", "/index.html", "btn_home");
        return;
    }

    const username = currentUser.username;

    const res = await fetch("/api/user/subscription-status", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ username })
    });

    const json = await res.json();

    if (!json.success) {
        blockWeeklyAccess("msg_verify_fail", "/index.html", "btn_home");
        return;
    }

    const status = json.status; // "active", "expired", "none"

    if (status === "active") {
        document.body.style.opacity = "1";
        console.log("Subscription OK — access granted.");
        return;
    }

    if (status === "expired") {
        blockWeeklyAccess("msg_expired", "/pages/subscription_form.html", "btn_subscribe");
        return;
    }

    blockWeeklyAccess("msg_none", "/pages/subscription_form.html", "btn_subscribe");
});

                    </button>

                    <button onclick="window.location.href='/index.html'"
                        style="
                            padding:12px 18px;
                            border-radius:10px;
                            border:1px solid rgba(255,255,255,0.2);
                            cursor:pointer;
                            font-size:14px;
                            font-weight:600;
                            background: rgba(255,255,255,0.08);
                            color:#e6e9f5;
                        ">
                        ${T[lang].btn_home}
                    </button>
                </div>
            </div>
        </div>
    `;

    // Wire blocker flags to change lang and rerender
    const btr = document.getElementById("b-flag-tr");
    const ben = document.getElementById("b-flag-en");

    if (btr) btr.onclick = () => { lang = "tr"; rerenderBlocker(); };
    if (ben) ben.onclick = () => { lang = "en"; rerenderBlocker(); };

    // active outline
    if (btr && ben) {
        if (lang === "tr") {
            btr.style.outline = "2px solid rgba(122,162,255,0.65)";
            btr.style.outlineOffset = "2px";
            ben.style.outline = "none";
        } else {
            ben.style.outline = "2px solid rgba(122,162,255,0.65)";
            ben.style.outlineOffset = "2px";
            btr.style.outline = "none";
        }
    }
}

function rerenderBlocker() {
    const c = window.__blockerCtx || { msgKey: "msg_none", primaryHref: "/pages/subscription_form.html", primaryLabelKey: "btn_subscribe", active:true };
    blockWeeklyAccess(c.msgKey, c.primaryHref, c.primaryLabelKey);
}
</script>
