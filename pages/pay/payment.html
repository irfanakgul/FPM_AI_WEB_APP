<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Abonelik Ödeme Formu</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 400px;
      margin: 30px auto;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 10px;
    }
    label { font-weight: bold; }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 5px;
      border: 1px solid #aaa;
    }
    button {
      background: #4CAF50;
      color: white;
      cursor: pointer;
      border: none;
    }
  </style>
</head>
<body>

  <h2>Abonelik Formu</h2>

  <form action="/payment" method="POST">
    <label>Ad</label>
    <input type="text" name="firstName" required />

    <label>Soyad</label>
    <input type="text" name="lastName" required />

    <label>E-Mail</label>
    <input type="email" name="email" required />

    <label>Abonelik Türü</label>
    <select name="plan" required>
      <option value="trial">Trial - Ücretsiz</option>
      <option value="monthly">Monthly - 50 TL</option>
      <option value="yearly">Yearly - 500 TL</option>
    </select>

    <button type="submit">Ödeme Yap</button>
  </form>

</body>
</html>
