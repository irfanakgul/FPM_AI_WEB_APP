<!-- =========================================================
FILE: /pages/admin_member_add.html
PURPOSE:
- Admin Member Add page (centralized header/footer)
- NO SIDEBAR, consistent with global layout
- Uses standard centered main-card container (like other pages)
- Preserves old form element IDs:
  username, password, userType, name, birthyear, mail, btnCreate
========================================================= -->
<!doctype html>
<html lang="en">
<head>
  <!-- [META] -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Add Admin Member • FPM AI</title>

  <!-- [GLOBAL CSS] shared theme + layout + header/footer -->
  <link rel="stylesheet" href="/css/style.css" />

  <!-- [PAGE CSS] only this page -->
  <link rel="stylesheet" href="/css/admin_member_add.css" />
</head>

<body class="no-sidebar">
  <div class="app-shell">
    <!-- [CENTRAL HEADER] injected by layout.js -->
    <header class="app-header" id="appHeader"></header>

    <!-- [NO SIDEBAR CONTENT] -->
    <div class="app-content no-sidebar-content">
      <main class="app-main">
        <!-- =====================================================
             STANDARD MAIN CARD (same concept as other pages)
        ====================================================== -->
        <div class="main-card admin-add-card">

          <!-- =================================================
               PAGE HEADER INSIDE CARD
          ================================================= -->
          <div class="page-head">
            <div>
              <h2 class="page-title">Add Admin Member</h2>
              <p class="page-sub">
                Create a new <b>admin</b> or <b>co-admin</b> user.
              </p>
            </div>

            <!-- [SOFT LINKS] visual only -->
            <div class="page-actions">
              <a class="pill-link" href="/pages/admin.html">← Back to Admin</a>
              <a class="pill-link" href="/index.html">Home</a>
            </div>
          </div>

          <!-- =================================================
               FORM GRID
               NOTE: IDs must not change
          ================================================= -->
          <div class="form-grid">

            <!-- Username -->
            <div class="field">
              <label for="username">Username</label>
              <input id="username" placeholder="e.g. admin_02" autocomplete="username" />
            </div>

            <!-- Password -->
            <div class="field">
              <label for="password">Password</label>
              <input id="password" type="password" placeholder="min 4 chars" autocomplete="new-password" />
            </div>

            <!-- User Type -->
            <div class="field">
              <label for="userType">User Type</label>
              <select id="userType">
                <option value="admin">Admin</option>
                <option value="co-admin">Co-Admin</option>
              </select>
            </div>

            <!-- Name -->
            <div class="field">
              <label for="name">Name</label>
              <input id="name" placeholder="Optional" autocomplete="name" />
            </div>

            <!-- Birthyear -->
            <div class="field">
              <label for="birthyear">Birth Year</label>
              <input id="birthyear" placeholder="YYYY" inputmode="numeric" />
            </div>

            <!-- Mail -->
            <div class="field">
              <label for="mail">Email</label>
              <input id="mail" type="email" placeholder="email@example.com" autocomplete="email" />
            </div>

          </div>

          <!-- =================================================
               PRIMARY ACTION
               NOTE: ID preserved (btnCreate)
          ================================================= -->
          <div class="cta-row">
            <button id="btnCreate" class="btn-primary-wide" type="button">
              Create Member
            </button>
          </div>

          <!-- =================================================
               MESSAGE LINE (optional UI feedback)
          ================================================= -->
          <div id="msg" class="msg-line" aria-live="polite"></div>

        </div>
      </main>
    </div>

    <!-- [CENTRAL FOOTER] injected by layout.js -->
    <footer class="app-footer" id="appFooter"></footer>
  </div>

  <!-- =========================================================
       SCRIPTS (order important)
  ========================================================= -->
  <script src="/js/layout.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/admin_member_add.js"></script>
</body>
</html>
