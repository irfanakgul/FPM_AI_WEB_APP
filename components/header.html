<div class="header-inner">
  <div class="brand">
    <img class="brand-logo" src="/docs/fpm_logo.png" alt="FPM Logo"
     onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='flex';" />

    <div id="logoFallback" class="logo-fallback" style="display:none;">FPM</div>
  </div>

  <div class="header-right">
    <div class="user-box" id="userBox" style="display:none;">
      <div class="user-line">
        <span class="label" data-i18n="username">User</span>:
        <span class="value" id="userName">demo_user</span>
      </div>
      <div class="user-line">
        <span class="label" data-i18n="usertype">Type</span>:
        <span class="value" id="userType">admin</span>
      </div>
    </div>

    <div class="lang-switch">
      <button class="icon-btn" id="btnLangEn" aria-label="English">🇬🇧</button>
      <button class="icon-btn" id="btnLangTr" aria-label="Türkçe">🇹🇷</button>
    </div>

    <div class="auth-actions" id="authActions">
      <!-- JS login durumuna göre burayı dolduracak -->
    </div>
  </div>
</div>
